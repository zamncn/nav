<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="tonny" />
    <title>404 · 页面不存在</title>
    <!-- 角标取自原站 chenn.com.cn 的 assets/img/logo.png（粉色字标 Chenn）；404 页不参与 SEO，标题保持独立 -->
    <link rel="icon" href="./assets/images/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="./assets/images/favicon.png" sizes="32x32">
    <link rel="apple-touch-icon" href="./assets/images/favicon-180.png">
    <style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        height: 100%;
        margin: 0;
    }

    body {
        background: #14161a;
        color: #e6eaf0;
        font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        font-weight: 300;
        line-height: 1.75;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
    }

    .box {
        max-width: 560px;
        width: 100%;
    }

    .code {
        font-size: 84px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: 4px;
        margin: 0 0 18px;
        background: linear-gradient(135deg, #4d90fe, #9cc4ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    p {
        margin: 0 0 8px;
        color: #a4aebb;
        font-size: 15px;
    }

    .actions {
        margin-top: 28px;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
    }

    a.btn {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        border: 1px solid #2b323d;
        color: #e6eaf0;
        -webkit-transition: all .2s ease;
        transition: all .2s ease;
    }

    a.btn:hover {
        border-color: #3d4756;
        background: #1e232c;
    }

    a.btn.primary {
        background: #4d90fe;
        border-color: #4d90fe;
        color: #fff;
    }

    a.btn.primary:hover {
        background: #3b82f6;
        border-color: #3b82f6;
    }
    </style>
</head>

<body>
    <div class="box">
        <h1 class="code">404</h1>
        <p>你要找的页面不存在，或者链接已经失效。</p>
        <p>可以回到导航首页，从分类里重新找一个入口。</p>
        <div class="actions">
            <a class="btn primary" id="home" href="./cn/index.html">回到导航首页</a>
            <a class="btn" href="#" id="back">返回上一页</a>
        </div>
    </div>

    <script>
    (function() {
        var home = document.getElementById('home');
        var back = document.getElementById('back');

        // GitHub Pages 项目页的站点根是 /仓库名/，按当前路径首段推断
        try {
            if (/(^|\.)github\.io$/i.test(location.hostname)) {
                var segs = location.pathname.split('/').filter(Boolean);
                if (segs.length) home.setAttribute('href', '/' + segs[0] + '/cn/index.html');
            }
        } catch (e) {}

        if (back) {
            back.addEventListener('click', function(e) {
                e.preventDefault();
                if (history.length > 1) history.back();
                else location.href = home.getAttribute('href');
            });
        }
    })();
    </script>
</body>

</html>
